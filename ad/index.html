  [hidden]{display:none!important}

  body{margin:0;font-family:'Inter',system-ui,sans-serif}

  /* Straight-down rain: short streak tiles scrolled vertically only */
  @keyframes fallNear { from { background-position: 0 0; } to { background-position: 0 720px; } }
  @keyframes fallMid  { from { background-position: 0 0; } to { background-position: 0 560px; } }
  @keyframes fallFar  { from { background-position: 0 0; } to { background-position: 0 420px; } }
  .rain-zone{
    position:absolute; inset:0; overflow:hidden; pointer-events:none;
    -webkit-mask-image:url(rain-left-mask.png); mask-image:url(rain-left-mask.png);
    -webkit-mask-size:100% 100%; mask-size:100% 100%;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  }
  .rain-far{ position:absolute; inset:0; background-image:url(rain-far.png); background-size:240px 420px; opacity:.7; animation: fallFar 0.95s linear infinite; }
  .rain-mid{ position:absolute; inset:0; background-image:url(rain-mid.png); background-size:300px 560px; background-position-x:90px; opacity:.8; animation: fallMid 0.62s linear infinite; }
  .rain-near{ position:absolute; inset:0; background-image:url(rain-near.png); background-size:360px 720px; opacity:.85; animation: fallNear 0.48s linear infinite; }

  /* Splash rings where drops hit the wet street */
  @keyframes splash {
    0%   { transform: translate(-50%,-50%) scale(.15); opacity: 0; }
    3%   { opacity: .75; }
    24%  { transform: translate(-50%,-50%) scale(1); opacity: 0; }
    100% { transform: translate(-50%,-50%) scale(1); opacity: 0; }
  }
  .splash{ position:absolute; border:1.5px solid rgba(230,238,246,.7); border-radius:50%; opacity:0; animation: splash linear infinite; }

  /* Droplets sliding down the glass */
  @keyframes slide {
    0%   { transform: translateY(0); opacity: 0; }
    6%   { opacity: 1; }
    28%  { transform: translateY(calc(var(--d) * .06)); }
    40%  { transform: translateY(calc(var(--d) * .30)); }
    55%  { transform: translateY(calc(var(--d) * .36)); }
    92%  { opacity: 1; }
    100% { transform: translateY(var(--d)); opacity: 0; }
  }
  @keyframes trail {
    0%   { transform: scaleY(0); opacity: 0; }
    6%   { opacity: .55; }
    28%  { transform: scaleY(.06); }
    40%  { transform: scaleY(.30); }
    55%  { transform: scaleY(.36); }
    85%  { opacity: .4; }
    100% { transform: scaleY(1); opacity: 0; }
  }
  .slider{ position:absolute; width:8px; pointer-events:none; }
  .slider .trail{ position:absolute; left:3px; top:0; width:2px; height:var(--d); transform-origin:top; background:linear-gradient(180deg, rgba(220,232,242,.0), rgba(220,232,242,.45)); border-radius:2px; animation: trail ease-in infinite; animation-duration:inherit; animation-delay:inherit; }
  .slider .bead{ position:absolute; left:0; top:-4px; width:8px; height:10px; border-radius:50% 50% 48% 48%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.95) 0 18%, rgba(205,220,232,.55) 30%, rgba(30,40,50,.45) 75%, rgba(30,40,50,0) 80%); animation: slide ease-in infinite; animation-duration:inherit; animation-delay:inherit; }
  /* Headphones: pulse + slanted "tap to listen" printed on the ear cup */
  @keyframes hpPulse { 0% { transform: translate(-50%,-50%) scale(.9); opacity:.8; } 100% { transform: translate(-50%,-50%) scale(1.6); opacity:0; } }
  .hp-ring{ position:absolute; left:652px; top:928px; width:150px; height:170px; border-radius:50%; border:3px solid rgba(255,209,102,.95); pointer-events:none; animation: hpPulse 1.8s ease-out infinite; }

  .cup-label{ position:absolute; left:652px; top:926px; width:120px; transform: translate(-50%,-50%) rotate(-11deg) skewY(-3deg) scaleX(.9); display:flex; flex-direction:column; align-items:center; gap:2px; pointer-events:none; text-align:center; }

<script>
class Ad {
  constructor() {
    this.state = { playing: false, rainOn: false };
    this.toggle = this.toggle.bind(this);
    this.toggleRain = this.toggleRain.bind(this);
  }
  // Her music (tap her head)
  toggle() {
    if (!this.audio) {
      this.audio = new Audio('music.mp3');
      this.audio.loop = true;
      this.audio.preload = 'auto';
    }
    if (this.state.playing) {
      this.audio.pause();
      this.setState({ playing: false }, () => this.setRainLevel());
    } else {
      const p = this.audio.play();
      if (p && p.catch) p.catch(() => this.setState({ playing: false }, () => this.setRainLevel()));
      this.setState({ playing: true }, () => this.setRainLevel());
    }
  }
  // Rain sound, generated live (no recording needed)
  buildRain() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const len = ctx.sampleRate * 3;
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; }
    const master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    const hiss = ctx.createBufferSource(); hiss.buffer = buf; hiss.loop = true;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 600;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7000;
    const hissGain = ctx.createGain(); hissGain.gain.value = 0.22;
    hiss.connect(hp); hp.connect(lp); lp.connect(hissGain); hissGain.connect(master);
    const body = ctx.createBufferSource(); body.buffer = buf; body.loop = true; body.loopStart = 1.1;
    const lp2 = ctx.createBiquadFilter(); lp2.type = 'lowpass'; lp2.frequency.value = 420;
    const bodyGain = ctx.createGain(); bodyGain.gain.value = 0.55;
    body.connect(lp2); lp2.connect(bodyGain); bodyGain.connect(master);
    hiss.start(); body.start(0, 1.1);
    this.rain = { ctx, master, buf };
    this.drips = setInterval(() => this.drip(), 70);
  }
  drip() {
    const r = this.rain; if (!r || !this.state.rainOn || Math.random() > 0.55) return;
    const { ctx, master, buf } = r; const t = ctx.currentTime;
    const s = ctx.createBufferSource(); s.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800 + Math.random() * 3200; bp.Q.value = 4;
    const g = ctx.createGain(); const v = 0.08 + Math.random() * 0.22;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05 + Math.random() * 0.06);
    const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    s.connect(bp); bp.connect(g);
    if (pan) { pan.pan.value = Math.random() * 2 - 1; g.connect(pan); pan.connect(master); } else g.connect(master);
    s.start(t, Math.random() * 2, 0.15);
  }
  setRainLevel() {
    const r = this.rain; if (!r) return;
    const target = this.state.rainOn ? (this.state.playing ? 0.25 : 0.9) : 0;
    const t = r.ctx.currentTime;
    r.master.gain.cancelScheduledValues(t);
    r.master.gain.setValueAtTime(r.master.gain.value, t);
    r.master.gain.linearRampToValueAtTime(target, t + 0.8);
  }
  toggleRain() {
    if (!this.rain) this.buildRain();
    if (this.rain.ctx.state === 'suspended') this.rain.ctx.resume();
    this.setState({ rainOn: !this.state.rainOn }, () => this.setRainLevel());
  }
  componentWillUnmount() {
    if (this.audio) this.audio.pause();
    if (this.drips) clearInterval(this.drips);
    if (this.rain) this.rain.ctx.close();
  }
  render() {
    const playing = !!this.state.playing, rainOn = !!this.state.rainOn;
    return {
      playing, off: !playing,
      label: playing ? 'Stop her music' : 'Play the music she is listening to',
      toggle: this.toggle,
      rainOn,
      rainClass: rainOn ? 'rain-btn on' : 'rain-btn',
      rainText: rainOn ? 'Rain sound: On' : 'Rain sound: Off',
      rainLabel: rainOn ? 'Turn rain sound off' : 'Turn rain sound on',
      toggleRain: this.toggleRain,
    };
  }
}

const ad = new Ad();
ad.setState = function (patch, cb) { Object.assign(this.state, patch); paint(); if (cb) cb(); };
function paint() {
  const v = ad.render();
  document.getElementById('hpOff').hidden = v.playing;
  document.getElementById('hpOn').hidden = !v.playing;
  const hb = document.getElementById('hpBtn');
  hb.setAttribute('aria-label', v.label); hb.setAttribute('aria-pressed', String(v.playing));
  const rb = document.getElementById('rainBtn');
  rb.className = v.rainClass; rb.setAttribute('aria-label', v.rainLabel); rb.setAttribute('aria-pressed', String(v.rainOn));
  document.getElementById('rainText').textContent = v.rainText;
}
document.getElementById('hpBtn').addEventListener('click', () => ad.toggle());
document.getElementById('rainBtn').addEventListener('click', () => ad.toggleRain());
function fit() {
  const s = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
  document.getElementById('stage').style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit); fit(); paint();
</script>
</body>
