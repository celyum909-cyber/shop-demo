<style>
:root{
  --brand:#2f6f4f;
  --bg:#f5f6f8; --panel:#ffffff; --panel-2:#eef0f4; --ink:#0e1a2b; --muted:#5f6b7a; --line:#e1e5ec;
  --shadow:0 6px 24px rgba(10,20,40,.08);
  /* Shop colors. These are filled in from "colors" in the settings block, with readable text picked automatically. */
  --on-brand:#fff; --brand-text:var(--brand);
  --accent:#c2462f; --on-accent:#fff; --accent-text:#c2462f;
  --member:var(--brand); --on-member:#fff; --member-text:var(--brand);
  --reward:#e0a92a; --on-reward:#111; --reward-text:#8a6410;
  --highlight:#fff; --on-highlight:#111;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --panel:#121b2c; --panel-2:#19243a; --ink:#eef2f7; --muted:#9aa7b8; --line:#26324a;
    --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --panel:#121b2c; --panel-2:#19243a; --ink:#eef2f7; --muted:#9aa7b8; --line:#26324a;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100dvh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}

/* header */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;border-radius:11px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:.5px;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.brand-name{min-width:0;flex:1}
.brand-name b{display:block;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-name small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member-chip{flex:none;border:1px solid var(--brand-text);background:transparent;color:var(--brand-text);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;white-space:nowrap}
.member-chip.is-member{background:var(--member);border-color:var(--member);color:var(--on-member)}

.view{display:none;padding:14px 16px 8px}
.view.active{display:block}
h2.section{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;font-weight:700}

/* weekly drop */
.drop{position:relative;display:grid;grid-template-columns:1fr 42%;gap:12px;align-items:center;padding:16px;border-radius:20px;color:var(--on-brand);background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 60%,#000));box-shadow:var(--shadow);overflow:hidden}
.drop::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:var(--member);opacity:.2}
.drop .eyebrow{font-size:11px;letter-spacing:1.8px;font-weight:800;text-transform:uppercase;color:var(--highlight)}
.drop h3{margin:6px 0 4px;font-size:21px;line-height:1.15}
.drop p{margin:0 0 10px;font-size:13px;opacity:.88}
.drop .prices{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.drop .prices b{font-size:22px}
.drop .prices s{opacity:.7;font-size:14px}
.drop .art{position:relative;z-index:1;background:rgba(255,255,255,.12);border-radius:16px;aspect-ratio:1;display:grid;place-items:center}
.drop .art{overflow:hidden}.drop .art svg{width:86%;height:86%}.drop .art img{width:100%;height:100%;object-fit:cover}
.drop-cta{border:0;border-radius:11px;background:var(--highlight);color:var(--on-highlight);font-weight:800;padding:10px 14px}
.drop .ends{display:block;margin-top:8px;font-size:11.5px;opacity:.8}
.drop .lock{display:inline-block;margin:4px 0 0;font-size:11px;font-weight:800;background:rgba(0,0,0,.25);border-radius:6px;padding:2px 6px;vertical-align:middle}

/* member strip */
.join-strip{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--panel);border:1.5px dashed color-mix(in srgb,var(--member) 70%,var(--line))}
.join-strip span{flex:1;font-size:13.5px}
.join-strip b{color:var(--member-text)}
.join-strip button{border:0;border-radius:10px;background:var(--member);color:var(--on-member);font-weight:700;padding:9px 12px;white-space:nowrap}

/* sale row */
.sale-row{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.sale-row::-webkit-scrollbar{display:none}
.sale-row .card{flex:0 0 42%;scroll-snap-align:start}

/* chips + grid */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{position:relative;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.card .thumb{aspect-ratio:1;border-radius:12px;background:var(--panel-2);display:grid;place-items:center;overflow:hidden}
.card .thumb svg{width:82%;height:82%}.card .thumb img{width:100%;height:100%;object-fit:cover}
.card .name{font-weight:650;font-size:14px;line-height:1.25}
.price-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;font-size:14px}
.price-line b{font-size:15px}
.price-line s{color:var(--muted);font-size:12.5px}
.price-line .deal{color:var(--accent-text)}
.member-hint{font-size:12px;color:var(--member-text);font-weight:600}
.badge{position:absolute;top:16px;left:16px;font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;border-radius:6px;padding:3px 7px;color:var(--on-accent);background:var(--accent)}
.badge.drop-b{background:var(--highlight);color:var(--on-highlight)}
.badge.mem-b{background:var(--member);color:var(--on-member)}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-inner{display:flex;width:100%;max-width:520px}
.tab{position:relative;flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--brand-text)}
.tab .count{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.tab .count[hidden],.tab .dot[hidden]{display:none}
.tab .dot{position:absolute;top:7px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--reward);box-shadow:0 0 0 2px var(--panel)}

/* product sheet */
dialog.sheet{width:100%;max-width:520px;margin:auto auto 0;border:0;padding:0;border-radius:22px 22px 0 0;background:var(--panel);color:var(--ink);max-height:92dvh;overflow:auto}
dialog.sheet::backdrop{background:rgba(10,12,10,.45)}
dialog.sheet[open]{animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){dialog.sheet[open]{animation:none}}
.sheet-in{padding:14px 18px calc(18px + env(safe-area-inset-bottom))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet-close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:20px;line-height:1}
.sheet .hero{aspect-ratio:4/3;border-radius:16px;background:var(--panel-2);display:grid;place-items:center;overflow:hidden}
.sheet .hero svg{width:70%;height:86%}.sheet .hero img{width:100%;height:100%;object-fit:contain}
.sheet h3{margin:14px 0 2px;font-size:21px}
.sheet .desc{margin:4px 0 10px;color:var(--muted);font-size:14px}
.sheet .price-line{font-size:16px}.sheet .price-line b{font-size:22px}
.why{display:inline-block;margin-left:2px;font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 7px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-text)}
.why.member{background:color-mix(in srgb,var(--member) 22%,transparent);color:var(--member-text)}
.label{display:block;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.size{flex:1 0 52px;min-height:44px;border-radius:11px;border:1px solid var(--line);background:var(--panel);font-weight:700}
.size[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.buy{display:flex;gap:10px;margin-top:18px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.qty button{width:42px;min-height:48px;border:0;background:none;font-size:20px}
.qty output{min-width:24px;text-align:center;font-weight:700}
.primary{flex:1;min-height:50px;border:0;border-radius:13px;background:var(--brand);color:var(--on-brand);font-weight:800;font-size:16px}
.primary.join-btn{background:var(--member);color:var(--on-member)}
.primary:disabled{opacity:.55;cursor:default}
.hint{min-height:18px;margin:8px 0 0;font-size:13px;color:var(--accent-text);text-align:center}
.nudge{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--panel-2);font-size:13px}
.nudge button{border:0;background:none;color:var(--member-text);font-weight:800;padding:0;text-decoration:underline}

/* cart */
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line .thumb{width:64px;height:64px;border-radius:12px;background:var(--panel-2);display:grid;place-items:center}
.line .thumb{overflow:hidden}.line .thumb svg{width:80%;height:80%}.line .thumb img{width:100%;height:100%;object-fit:cover}
.line b{display:block;font-size:14.5px}
.line small{display:block;color:var(--muted);font-size:12.5px;margin:2px 0 7px}
.line .qty button{width:34px;min-height:34px;font-size:17px}
.line .right{text-align:right}
.line .right b{font-size:15px}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12.5px;padding:6px 0}
.panel{margin-top:16px;padding:14px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.seg button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:14px;line-height:1.2}
.seg button small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.seg button[aria-pressed="true"]{border-color:var(--brand-text);box-shadow:inset 0 0 0 1.5px var(--brand-text)}
.row{display:flex;justify-content:space-between;margin:4px 0;font-size:14px;color:var(--muted)}
.row.save{color:var(--member-text);font-weight:600}
.row.total{color:var(--ink);font-size:18px;font-weight:800;margin-top:8px}
.fine{font-size:12px;color:var(--muted);text-align:center;margin:10px 0 0}
.empty{text-align:center;padding:50px 16px;color:var(--muted)}
.empty b{display:block;font-size:19px;color:var(--ink);margin-bottom:6px}
.ghost{margin-top:16px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 18px;font-weight:700}
.done{text-align:center;padding:26px 6px}
.done .tick{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:30px;font-weight:800}
.done h3{margin:0 0 4px;font-size:22px}
.done p{margin:4px 0;color:var(--muted)}
.done ul{list-style:none;padding:0;margin:16px 0 0;text-align:left}
.done li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.tag{display:inline-block;margin-top:12px;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:4px 9px;color:var(--muted)}
.earned{margin-top:14px;border:0;border-radius:12px;background:color-mix(in srgb,var(--reward) 30%,transparent);color:var(--ink);font-weight:700;padding:11px 14px}

/* rewards */
/* The punch card: same family as the member card and weekly drop (brand gradient, member-colour circle).
   Punched holes are cut through the card, so you see the page behind them. */
.pcard{position:relative;max-width:440px;margin:0 auto;border-radius:20px;color:var(--on-brand);background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 55%,#000));box-shadow:var(--shadow);overflow:hidden;isolation:isolate}
.pcard::after{content:"";position:absolute;right:-50px;bottom:-80px;width:210px;height:210px;border-radius:50%;background:var(--member);opacity:.22;z-index:-1}
.pcard::before{content:"";position:absolute;left:-50px;top:-70px;width:150px;height:150px;border-radius:50%;background:var(--accent);opacity:.12;z-index:-1}
.pc-notch{position:absolute;top:66px;width:22px;height:22px;border-radius:50%;background:var(--bg);box-shadow:inset 0 2px 3px rgba(0,0,0,.3)}
.pc-notch.l{left:-11px}.pc-notch.r{right:-11px}
.pc-top{display:flex;align-items:center;gap:12px;padding:18px 18px 16px}
.pc-logo{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:.5px;background:var(--on-brand);color:var(--brand);overflow:hidden}
.pc-logo img{width:100%;height:100%;object-fit:cover}
.pc-top small{display:block;font-size:11px;letter-spacing:1.8px;text-transform:uppercase;font-weight:800;color:var(--highlight)}
.pc-top b{display:block;font-size:21px;line-height:1.15}
.pc-top .pc-no{margin-left:auto;align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:1px;opacity:.7;white-space:nowrap}
.pc-body{padding:16px 20px 14px;border-top:2px dashed color-mix(in srgb,var(--on-brand) 30%,transparent)}
.holes{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 14px}
.hole{position:relative;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:2px dashed color-mix(in srgb,var(--on-brand) 40%,transparent);color:color-mix(in srgb,var(--on-brand) 70%,transparent);font-size:14px;font-weight:700}
.hole.prize{border:2px solid var(--reward);color:var(--reward);font-size:10px;font-weight:800;letter-spacing:.6px;flex-direction:column;line-height:1;gap:2px}
.hole.prize svg{width:16px;height:16px;fill:var(--reward)}
.hole.on{border:0;background:var(--bg);box-shadow:inset 0 5px 7px rgba(0,0,0,.45),0 0 0 3px color-mix(in srgb,var(--member) 55%,transparent)}
.hole.on>*{visibility:hidden}
.hole.prize.on{box-shadow:inset 0 5px 7px rgba(0,0,0,.45),0 0 0 3px var(--reward)}
.hole.new{animation:punch .45s cubic-bezier(.2,1.5,.4,1) both}
.hole.new::after{content:"";position:absolute;inset:8%;border-radius:50%;background:var(--brand);box-shadow:0 2px 4px rgba(0,0,0,.3);animation:chad .9s ease-in both;animation-delay:inherit}
@keyframes punch{from{transform:scale(.3);opacity:0}}
@keyframes chad{0%{transform:none;opacity:1}100%{transform:translate(14px,70px) rotate(220deg) scale(.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.hole.new{animation:none}.hole.new::after{display:none}}
.pc-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--on-brand) 18%,transparent);font-size:13px;opacity:.9}
.pc-foot b{font-size:15px}
.pcard.full{box-shadow:0 0 0 3px var(--reward),0 0 0 7px color-mix(in srgb,var(--reward) 30%,transparent),var(--shadow)}
.pc-note{margin:18px 0 0;font-size:13.5px;color:var(--muted);text-align:center}
.bar{height:8px;border-radius:4px;background:var(--panel-2);margin:16px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--member));border-radius:4px;transition:width .5s}
.bar-text{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bar-text b{color:var(--ink)}
.ready{margin-top:14px;padding:16px;border-radius:16px;text-align:center;background:color-mix(in srgb,var(--reward) 22%,var(--panel));border:1px solid var(--reward)}
.ready h3{margin:0 0 4px;font-size:20px}
.ready p{margin:4px 0;font-size:13.5px;color:var(--muted)}
.ready .ghost.arm{background:var(--reward);color:var(--on-reward);border-color:var(--reward)}
ol.how{margin:0;padding-left:20px;font-size:14px;color:var(--muted)}
ol.how li{margin:4px 0}
.history{list-style:none;padding:0;margin:0}
.history li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.history li span:last-child{color:var(--brand-text);font-weight:700}

/* members */
.mcard{position:relative;padding:20px 18px;border-radius:20px;color:var(--on-brand);background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 55%,#000));box-shadow:var(--shadow);overflow:hidden}
.mcard::after{content:"";position:absolute;right:-40px;bottom:-70px;width:200px;height:200px;border-radius:50%;background:var(--member);opacity:.22}
.mcard small{font-size:11px;letter-spacing:1.8px;font-weight:800;text-transform:uppercase;opacity:.85}
.mcard h3{margin:6px 0 2px;font-size:22px}
.mcard p{margin:2px 0;opacity:.9;font-size:14px}
.mcard .big{font-size:30px;font-weight:800;margin-top:12px}
.perks{list-style:none;padding:0;margin:0}
.perks li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14.5px}
.perks li::before{content:"✓";flex:none;width:22px;height:22px;border-radius:50%;background:color-mix(in srgb,var(--member) 25%,transparent);color:var(--member-text);display:grid;place-items:center;font-weight:800;font-size:13px}
form.join label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
form.join input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--panel);font-size:16px}
.info{list-style:none;padding:0;margin:0;font-size:14px}
.info li{padding:9px 0;border-bottom:1px solid var(--line)}
.info a{color:var(--brand-text);font-weight:600}
.info li b{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);width:min(92vw,480px);z-index:8;display:flex;align-items:center;gap:10px;padding:11px 12px 11px 14px;border-radius:14px;background:var(--ink);color:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:14px;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{border:0;border-radius:9px;background:var(--accent);color:var(--on-accent);font-weight:800;padding:8px 11px;white-space:nowrap}

:root{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
.theme-btn{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;padding:0}
.theme-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.theme-btn .sun{display:none}
:root[data-theme="dark"] .theme-btn .sun{display:block}:root[data-theme="dark"] .theme-btn .moon{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .theme-btn .sun{display:block}:root:not([data-theme="light"]) .theme-btn .moon{display:none}}
.share{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:center}
.share .qr{width:184px;height:184px;margin:0 auto 14px;padding:8px;background:#fff;border-radius:14px;border:1px solid var(--line)}
.share .qr svg{width:100%;height:100%;display:block}
.share p{margin:0 0 4px;font-size:14px;color:var(--muted)}
.share .share-url{font-weight:700;color:var(--ink);word-break:break-all;margin-bottom:12px}
.share .primary{width:100%}
.help-intro{font-size:15px;color:var(--muted);margin:4px 0 14px}
.faq{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.faq summary{list-style:none;cursor:pointer;padding:15px 44px 15px 16px;font-weight:700;font-size:16px;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";position:absolute;right:18px;top:50%;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);transition:transform .2s}
.faq[open] summary::after{transform:translateY(-30%) rotate(-135deg)}
.faq .body{padding:0 16px 14px;font-size:14.5px;line-height:1.55}
.faq .body p{margin:0 0 8px}
.faq .body ol,.faq .body ul{margin:0 0 8px;padding-left:20px}
.faq .body li{margin-bottom:4px}
.help-go{border:0;background:none;padding:0;color:var(--brand-text);font-weight:700;text-decoration:underline;font:inherit}

/* ---------- ADD TO PHONE BANNER ---------- */
.a2hs{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:200;max-width:460px;margin:0 auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px -12px rgba(0,0,0,.45);padding:14px 12px;display:flex;gap:12px;align-items:flex-start;transform:translateY(160%);transition:transform .35s ease}
.a2hs[hidden]{display:none}
.a2hs.show{transform:none}
.a2hs img{width:48px;height:48px;border-radius:12px;flex:none}
.a2hs-body{flex:1;min-width:0}
.a2hs-title{font-weight:800;font-size:15px}
.a2hs-steps{font-size:13.5px;color:var(--muted);line-height:1.45;margin-top:4px}
.a2hs-steps b{color:var(--ink)}
.a2hs-share{display:inline-block;width:15px;height:15px;vertical-align:-2px}
.a2hs-install{margin-top:10px;background:var(--brand);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:800;font-size:13px;cursor:pointer}
:root[data-theme="dark"] .a2hs-install{background:color-mix(in srgb,var(--brand) 70%,#fff)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .a2hs-install{background:color-mix(in srgb,var(--brand) 70%,#fff)}}
.a2hs-close{flex:none;background:none;border:0;color:var(--muted);font-size:24px;line-height:1;padding:0 4px;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo" id="logo"></div>
    <div class="brand-name"><b id="store-name"></b><small id="store-tagline"></small></div>
    <button class="member-chip" id="member-chip" type="button"></button>
    <button class="theme-btn" id="theme-btn" type="button" aria-label="Switch to dark mode"><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </header>

  <main>
    <section class="view active" id="view-shop" aria-label="Shop">
      <div id="drop-slot"></div>
      <div id="join-slot"></div>
      <div id="sale-slot"></div>
      <h2 class="section">Shop</h2>
      <div class="chips" id="chips" role="group" aria-label="Categories"></div>
      <div class="grid" id="grid"></div>
    </section>
    <section class="view" id="view-rewards" aria-label="Rewards"></section>
    <section class="view" id="view-members" aria-label="Members"></section>
    <section class="view" id="view-cart" aria-label="Cart"></section>
    <section class="view" id="view-help" aria-label="Help"></section>
  </main>
</div>

<nav class="tabs" aria-label="Main">
  <div class="tabs-inner">
    <button class="tab" data-view="shop" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5 5.5 4h13L20 9.5"/><path d="M4 9.5h16v1a3 3 0 0 1-5.3 1.9A3 3 0 0 1 12 13.5a3 3 0 0 1-2.7-1.1A3 3 0 0 1 4 10.5v-1Z"/><path d="M5.5 13v7h13v-7"/></svg>Shop</button>
    <button class="tab" data-view="rewards" id="tab-rewards"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2.5"/><circle cx="8" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="16" cy="12" r="1.5"/></svg>Rewards<span class="dot" hidden></span></button>
    <button class="tab" data-view="members" id="tab-members"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9L12 3Z"/></svg>Members</button>
    <button class="tab" data-view="cart" id="tab-cart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></svg>Cart<span class="count" hidden></span></button>
    <button class="tab" data-view="help" id="tab-help"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.8"/><path d="M12 17.2v.1"/></svg>Help</button>
  </div>
</nav>

<dialog class="sheet" id="sheet" aria-label="Product"><div class="sheet-in" id="sheet-in"></div></dialog>
<div class="toast" id="toast" role="status"><span></span><button type="button">View cart</button></div>

<script>
'use strict';
const CFG = JSON.parse(document.getElementById('shop-config').textContent);
const S = CFG.store, API = (CFG.api || '').replace(/\/+$/, '');
const PRODUCTS = CFG.products, byId = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + (Math.round(n * 100) / 100).toFixed(2);
const round2 = n => Math.round(n * 100) / 100;
const whole = n => money(n).replace(/\.00$/, '');
const KEY = 'shop:' + (S.name || 'shop').toLowerCase().replace(/[^a-z0-9]+/g, '-') + ':';
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(KEY + k)); return v ?? d } catch { return d } };
const store = (k, v) => { try { localStorage.setItem(KEY + k, JSON.stringify(v)) } catch {} };


// ---------- Colors: picks readable text for every shop color, in light and dark mode ----------
function applyColors(c, fallback) {
  const hex = h => { h = String(h || '').trim().replace('#', ''); if (h.length === 3) h = h.replace(/./g, x => x + x); return /^[0-9a-f]{6}$/i.test(h) ? '#' + h.toLowerCase() : null };
  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const lum = h => { const [r, g, b] = rgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4 }); return .2126 * r + .7152 * g + .0722 * b };
  const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05) };
  const mix = (a, b, t) => '#' + rgb(a).map((v, i) => Math.round(v + (rgb(b)[i] - v) * t).toString(16).padStart(2, '0')).join('');
  const ink = h => contrast(h, '#ffffff') >= contrast(h, '#0e1a2b') ? '#ffffff' : '#0e1a2b';
  const readable = (h, bg, toward, min = 4.5) => { let t = 0, out = h; while (contrast(out, bg) < min && t < 1) { t += .05; out = mix(h, toward, t) } return out };
  const visible = (h, bg, min) => readable(h, bg, '#ffffff', min); // lift very dark colors so they show on a dark background
  const brand = hex(c.brand) || hex(fallback) || '#2f6f4f';
  const p = { brand, accent: hex(c.accent) || '#c2462f', member: hex(c.member) || brand, reward: hex(c.reward) || '#e0a92a', highlight: hex(c.highlight) || hex(c.accent) || '#ffffff' };
  const LIGHT = '#ffffff', DARK = '#121b2c';
  const vars = mode => {
    const bg = mode === 'dark' ? DARK : LIGHT, toward = mode === 'dark' ? '#ffffff' : '#000000';
    const surf = h => mode === 'dark' ? visible(h, DARK, 1.6) : h;
    const v = {};
    for (const [k, h] of Object.entries(p)) { const s = surf(h); v['--' + k] = s; v['--on-' + k] = ink(s); v['--' + k + '-text'] = readable(h, bg, toward) }
    return Object.entries(v).map(([k, x]) => `${k}:${x}`).join(';');
  };
  const css = `:root{${vars('light')}}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${vars('dark')}}}:root[data-theme="dark"]{${vars('dark')}}`;
  let el = document.getElementById('shop-colors'); if (!el) { el = document.createElement('style'); el.id = 'shop-colors'; document.head.appendChild(el) }
  el.textContent = css;
}

// ---------- Branding ----------
document.title = S.name;
applyColors(S.colors || {}, S.brandColor || '#2f6f4f');
$('meta[name=theme-color]').content = (S.colors && S.colors.brand) || S.brandColor || '#2f6f4f';
$('#store-name').textContent = S.name; $('#store-tagline').textContent = S.tagline || '';
$('#logo').innerHTML = S.logo ? `<img src="${esc(S.logo)}" alt="">` : esc(S.initials || S.name.slice(0, 2).toUpperCase());

// ---------- Product art (used when a product has no photo) ----------
function art(p) {
  const up = live.photos && live.photos[p.id];
  if (up && API) return `<img src="${esc(API + '/photo/' + encodeURIComponent(p.id) + '?v=' + up)}" alt="" loading="lazy">`;
  if (p.image) return `<img src="${esc(p.image)}" alt="" loading="lazy">`;
  const c = p.color || '#888', dark = c.match(/^#(..)(..)(..)$/) ? (parseInt(RegExp.$1,16)*.3 + parseInt(RegExp.$2,16)*.59 + parseInt(RegExp.$3,16)*.11) < 140 : true;
  const line = dark ? 'rgba(255,255,255,.35)' : 'rgba(0,0,0,.18)', mark = dark ? 'rgba(255,255,255,.85)' : 'rgba(0,0,0,.55)';
  const ini = esc((S.initials || 'S').slice(0, 2));
  const shapes = {
    tee: `<path d="M38 14 22 22 12 44l14 6 4-8v52h40V42l4 8 14-6-10-22-16-8c-2 6-7 10-12 10s-10-4-12-10Z" fill="${c}" stroke="${line}" stroke-width="1.5"/><text x="50" y="60" text-anchor="middle" font-size="11" font-weight="800" fill="${mark}" font-family="system-ui">${ini}</text>`,
    hoodie: `<path d="M34 24c0-16 32-16 32 0" fill="${c}" stroke="${line}" stroke-width="1.5" style="filter:brightness(.85)"/><path d="M34 18 20 26 8 70l13 4 9-30v50h40V44l9 30 13-4-12-44-14-8c-3 8-9 12-16 12s-13-4-16-12Z" fill="${c}" stroke="${line}" stroke-width="1.5"/><path d="M47 30v12M53 30v12" stroke="${line}" stroke-width="1.5"/><path d="M38 70h24l-3 14H41Z" fill="none" stroke="${line}" stroke-width="1.5"/><text x="50" y="60" text-anchor="middle" font-size="10" font-weight="800" fill="${mark}" font-family="system-ui">${ini}</text>`,
    cap: `<path d="M20 62c0-20 13-34 30-34s30 14 30 34Z" fill="${c}" stroke="${line}" stroke-width="1.5"/><path d="M14 62h72c0 7-14 10-36 10S14 69 14 62Z" fill="${c}" stroke="${line}" stroke-width="1.5" style="filter:brightness(.85)"/><circle cx="50" cy="28" r="3" fill="${line}"/><text x="50" y="52" text-anchor="middle" font-size="11" font-weight="800" fill="${mark}" font-family="system-ui">${ini}</text>`,
    tote: `<path d="M38 34v-8a12 12 0 0 1 24 0v8" fill="none" stroke="${dark?c:'#8a7a5c'}" stroke-width="4"/><path d="M24 34h52l-4 56H28Z" fill="${c}" stroke="${line}" stroke-width="1.5"/><text x="50" y="66" text-anchor="middle" font-size="12" font-weight="800" fill="${mark}" font-family="system-ui">${ini}</text>`,
    mug: `<path d="M24 30h42v46a10 10 0 0 1-10 10H34a10 10 0 0 1-10-10Z" fill="${c}" stroke="${dark?line:'rgba(0,0,0,.25)'}" stroke-width="1.5"/><path d="M66 40h6a10 10 0 0 1 0 20h-6" fill="none" stroke="${dark?line:'rgba(0,0,0,.25)'}" stroke-width="4"/><text x="45" y="62" text-anchor="middle" font-size="12" font-weight="800" fill="${mark}" font-family="system-ui">${ini}</text>`,
    sticker: `<rect x="22" y="26" width="40" height="40" rx="9" fill="${c}" transform="rotate(-10 42 46)"/><circle cx="62" cy="58" r="18" fill="${c}" stroke="#fff" stroke-width="3" style="filter:hue-rotate(140deg)"/><text x="62" y="62" text-anchor="middle" font-size="10" font-weight="800" fill="#fff" font-family="system-ui">${ini}</text>`,
  };
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${shapes[p.art] || `<rect x="22" y="22" width="56" height="56" rx="12" fill="${c}"/><text x="50" y="56" text-anchor="middle" font-size="13" font-weight="800" fill="${mark}" font-family="system-ui">${ini}</text>`}</svg>`;
}

// ---------- Live settings: weekly drop, sales, member discount ----------
// With no "api" set the app runs in practice mode using the "demo" values above.
let live = { drop: CFG.demo?.drop || null, sales: CFG.demo?.sales || {}, memberPercent: CFG.members?.percentOff ?? 0, photos: {} };
let member = load('member', null);
const isMember = () => !!(CFG.members?.enabled && member && member.email);
function activeDrop() {
  const d = live.drop;
  if (!d || !byId[d.id] || !(d.price > 0)) return null;
  if (d.ends && Date.now() > new Date(d.ends + 'T23:59:59').getTime()) return null;
  return d;
}
// The customer always pays the single lowest price they qualify for. Deals don't stack.
function priceOf(p, asMember = isMember()) {
  let price = p.price, why = '';
  const sale = Number(live.sales[p.id]);
  if (sale > 0 && sale < price) { price = sale; why = 'sale' }
  const d = activeDrop();
  if (d && d.id === p.id && (!d.membersOnly || asMember) && d.price < price) { price = d.price; why = 'drop' }
  const mp = memberPriceOf(p);
  if (asMember && mp < price) { price = mp; why = 'member' }
  return { price: round2(price), was: p.price, why, memberPrice: mp };
}
function memberPriceOf(p) {
  if (!CFG.members?.enabled) return Infinity;
  if (p.memberPrice > 0) return p.memberPrice;
  const pct = Number(live.memberPercent) || 0;
  return pct > 0 ? round2(p.price * (1 - pct / 100)) : Infinity;
}

// ---------- Shop view ----------
let category = 'All';
function priceHTML(p) {
  const r = priceOf(p);
  let h = `<div class="price-line">${r.why ? `<b class="deal">${money(r.price)}</b><s>${money(r.was)}</s>` : `<b>${money(r.price)}</b>`}</div>`;
  if (!isMember() && r.memberPrice < r.price) h += `<div class="member-hint">${money(r.memberPrice)} for members</div>`;
  return h;
}
function badgeFor(p) {
  const r = priceOf(p), d = activeDrop();
  if (d && d.id === p.id) return `<span class="badge drop-b">Drop</span>`;
  if (r.why === 'sale') return `<span class="badge">Sale</span>`;
  if (r.why === 'member') return `<span class="badge mem-b">Member</span>`;
  return '';
}
function cardHTML(p) {
  return `<button class="card" type="button" data-id="${esc(p.id)}" aria-label="${esc(p.name)}">${badgeFor(p)}<div class="thumb">${art(p)}</div><div class="name">${esc(p.name)}</div>${priceHTML(p)}</button>`;
}
function renderShop() {
  const d = activeDrop(), dp = d && byId[d.id];
  if (dp) {

// One punch per order, as long as the order is at least "punchValue" (after discounts, not counting shipping).
// A bigger order still earns just one punch.

// Uses store.shareUrl from the settings block; if that's empty, the address this page was opened from.
function shareUrl() {

function qrSvg(text) {

    return `<svg viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" shape-rendering="crispEdges" role="img" aria-label="QR code for ${esc(text)}"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  } catch { return '' }
}
function shareBlock() {

    <p>Friends can scan this with their phone camera to open ${esc(S.name)}.</p>
    <p class="share-url">${esc(url.replace(/^https?:\/\//, '').replace(/\/$/, ''))}</p>
    <button class="primary" type="button" id="share-btn">Share link</button></div>`;
}
$('#view-members').addEventListener('click', async e => {
  if (!e.target.closest('#share-btn')) return;
  const url = shareUrl();
  if (navigator.share) { try { await navigator.share({ title: S.name, text: `Check out ${S.name}`, url }) } catch {} return }
  try { await navigator.clipboard.writeText(url); toast('Link copied. Paste it in a text to a friend.', false) }
  catch { toast(url, false) }
});

// ---------- Help (how to use the app, filled in from the settings block) ----------
const privacyLink = () => CFG.privacy?.page ? `<a href="${esc(CFG.privacy.page)}" style="color:inherit">Privacy policy</a>` : '';
function renderHelp() {
  const M = CFG.members || {}, ship = CFG.shipping || {}, pct = Number(live.memberPercent) || 0;
  const go = (view, label) => `<button type="button" class="help-go" data-go="${view}">${label}</button>`;
  const q = (title, body, open) => `<details class="faq"${open ? ' open' : ''}><summary>${title}</summary><div class="body">${body}</div></details>`;
  const items = [
    q('Placing an order', `<ol><li>Tap any product in the ${go('shop', 'Shop')} tab.</li><li>Pick a size and how many you want, then tap <b>Add to cart</b>.</li><li>Open the ${go('cart', 'Cart')} tab, check everything, then tap <b>Checkout</b>.</li><li>Pay on the secure Stripe page. Your card details go to Stripe, never to the shop.</li><li>You come back to the app and see <b>Order placed</b> with your order number.</li></ol><p>Change amounts or remove items in the cart with the − and + buttons.</p>`, true),
    q('Sizes', `<p>Each product shows the sizes it comes in. Tap one before adding to your cart. Items like stickers or mugs are one size, so there's nothing to pick.</p><p>Not sure about fit? ${S.phone || S.email ? 'Ask us before you order (details at the bottom).' : 'Ask us in store before you order.'}</p>`),
    ship.enabled
      ? q('Pickup or shipping', `<p>In the cart, choose how you want your order:</p><ul><li><b>Pick up in store</b>: free.${S.address ? ` Collect it at ${esc(S.address)}.` : ''}${S.hours ? ` Hours: ${esc(S.hours)}.` : ''}</li><li><b>Ship to me</b>: ${money(ship.flat)} flat, anywhere in the US. You type your address on the payment page.</li></ul>`)
      : q('Picking up your order', `<p>Orders are picked up in store.${S.address ? ` Find us at ${esc(S.address)}.` : ''}${S.hours ? ` Hours: ${esc(S.hours)}.` : ''}</p>`),
    q('Deals and prices', `<p>Look out for <b>this week's drop</b> at the top of the shop, and items marked on sale.${M.enabled ? ' Members also get their own prices.' : ''}</p><p>You always pay the <b>single lowest price</b> you qualify for. Deals don't stack, and the cart always shows what you'll pay before you check out.</p>`),
    M.enabled ? q('Becoming a member', `<ol><li>Open the ${go('members', 'Members')} tab.</li><li>Enter your first name and email, then tap <b>Join free</b>.</li><li>Prices drop straight away${pct ? `: <b>${pct}% off</b> everything` : ''}, applied for you at checkout.</li></ol><p>New phone? Join again with the <b>same email</b> and your member prices come back. To sign out on this phone, tap <b>Remove membership from this phone</b> at the bottom of the Members tab.</p>`) : '',
    R.enabled ? q('Rewards card', `<ul><li>Each order of <b>${whole(R.punchValue)} or more</b> earns one punch, however big the order (after discounts, not counting shipping).</li><li>Fill all <b>${R.punches}</b> punches for a <b>${esc(R.reward)}</b>.</li><li>Only paid orders count. Your card is in the ${go('rewards', 'Rewards')} tab.</li><li>When it's full, show that screen at the counter to claim your reward.</li></ul><p>The card is saved on this phone, so use the same phone and browser each time. Clearing your browser data resets it.</p>`) : '',
    q('Share the shop with friends', `<p>At the bottom of the ${go('members', 'Members')} tab there's a QR code. A friend can point their phone camera at it to open the shop. Or tap <b>Share link</b> to send it in a text.</p>`),
    q('Put the app on your home screen', `<ul><li><b>iPhone (Safari):</b> tap the Share button, then <b>Add to Home Screen</b>.</li><li><b>Android (Chrome):</b> tap the ⋮ menu, then <b>Add to Home screen</b> or <b>Install app</b>.</li></ul><p>It opens like an app, with no app store needed.</p><p><button type="button" class="help-go" onclick="window.shopShowInstall && window.shopShowInstall()">Show me how on this phone</button></p>`),
  ].join('');
  const contact = [S.phone ? `<li><b>Phone</b><a href="tel:${esc(S.phone.replace(/[^\d+]/g, ''))}">${esc(S.phone)}</a></li>` : '', S.email ? `<li><b>Email</b><a href="mailto:${esc(S.email)}">${esc(S.email)}</a></li>` : '', S.address ? `<li><b>Address</b>${esc(S.address)}</li>` : '', S.hours ? `<li><b>Hours</b>${esc(S.hours)}</li>` : ''].join('');
  $('#view-help').innerHTML = `<h2 class="section" style="margin-top:4px">How to use the app</h2><p class="help-intro">Quick answers about ordering, membership and rewards at ${esc(S.name)}.</p>${items}${contact ? `<h2 class="section">Still have a question?</h2><ul class="info">${contact}</ul>` : ''}${CFG.privacy?.page ? `<p class="fine" style="margin-top:16px"><a href="${esc(CFG.privacy.page)}">Privacy policy</a>: what we collect and how to have it deleted.</p>` : ''}`;
}

// ---------- Navigation, toast ----------
function show(name) {
  if (sheet.open) sheet.close();
  $('#toast').classList.remove('show');
  if (name !== 'cart' && cartView === 'done') { cartView = 'cart' }
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  document.querySelectorAll('.tab').forEach(t => t.dataset.view === name ? t.setAttribute('aria-current', 'page') : t.removeAttribute('aria-current'));
  ({ shop: renderShop, rewards: renderRewards, members: renderMembers, cart: renderCart, help: renderHelp })[name]?.();
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => show(t.dataset.view)));
let toastT;
function toast(text, withCart = true) { const t = $('#toast'); t.querySelector('span').textContent = text; t.querySelector('button').hidden = !withCart; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200) }
$('#toast button').onclick = () => { $('#toast').classList.remove('show'); show('cart') };
function renderAll() { const cur = document.querySelector('.view.active')?.id.replace('view-', '') || 'shop'; renderCount(); renderDot(); renderChip(); show(cur) }

// ---------- Start ----------
if (!R.enabled) $('#tab-rewards').hidden = true;
renderAll();
// Load this week's drop, sales and member discount from the shop's Worker.
if (API) {
  live = { drop: null, sales: {}, memberPercent: CFG.members?.percentOff ?? 0, photos: {} };
  fetch(API + '/store', { cache: 'no-store' }).then(r => r.json()).then(d => {
    if (d && !d.error) live = { drop: d.drop || null, sales: d.sales || {}, memberPercent: d.memberPercent ?? live.memberPercent, photos: d.photos || {} };
  }).catch(() => {}).finally(renderAll);
}
// Coming back from Stripe checkout.
const qs = new URLSearchParams(location.search);
if (qs.get('checkout')) {
  history.replaceState(null, '', location.pathname);
  if (qs.get('checkout') === 'success') {
    let p = null; try { p = JSON.parse(sessionStorage.getItem(KEY + 'pending')); sessionStorage.removeItem(KEY + 'pending') } catch {}
    const id = '#' + (qs.get('order') || '').slice(-8).toUpperCase();
    if (p) finishOrder({ id, key: qs.get('order'), lines: p.lines, total: p.total, spent: p.spent, fulfil: p.fulfil, practice: false });
    else { cart = []; saveCart(); lastOrder = { id, fulfil }; cartView = 'done'; show('cart') }
  } else show('cart');
}

// ---------- Light / dark switch ----------
(function () {
  const b = document.getElementById('theme-btn'), mq = matchMedia('(prefers-color-scheme: dark)');
  const isDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : mq.matches;
  const sync = () => {
    const d = isDark(); b.setAttribute('aria-label', d ? 'Switch to light mode' : 'Switch to dark mode'); b.title = d ? 'Light mode' : 'Dark mode';
    const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue(d ? '--bg' : '--brand').trim() || m.content;
  };
  b.addEventListener('click', () => { const next = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = next; try { localStorage.setItem('shop-theme', next) } catch (e) {} sync() });
  mq.addEventListener?.('change', sync); sync();
})();
</script>
<!-- ============ ADD TO PHONE BANNER ============ -->
<div class="a2hs" id="a2hs" role="dialog" aria-label="Add Shop to your phone" hidden>
  <img src="icon-192.png" alt="">
  <div class="a2hs-body">
    <div class="a2hs-title">Add Shop to your phone</div>
    <div class="a2hs-steps" id="a2hs-steps"></div>
    <button class="a2hs-install" id="a2hs-install" type="button" hidden>Install app</button>
  </div>
  <button class="a2hs-close" id="a2hs-close" type="button" aria-label="Close">&times;</button>
</div>
<script>
(function(){
  // Register the (non-caching) service worker so Android offers "Install app".
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
  var KEY = 'shop-a2hs-dismissed-v1';
  var banner = document.getElementById('a2hs');
  var steps = document.getElementById('a2hs-steps');
  var installBtn = document.getElementById('a2hs-install');
  var deferred = null;
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);
  var isPhone = isIOS || isAndroid;
  var installed = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

  function dismissedRecently(){ try{ return Date.now() - (+localStorage.getItem(KEY) || 0) < 3 * 864e5; }catch(e){ return false; } }
  function remember(){ try{ localStorage.setItem(KEY, String(Date.now())); }catch(e){} }
  function hide(){ banner.classList.remove('show'); setTimeout(function(){ banner.hidden = true; }, 400); }
  function show(){
    banner.hidden = false;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ banner.classList.add('show'); }); });
  }

  var shareIcon = '<svg class="a2hs-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
  if(isIOS){
    steps.innerHTML = 'Tap ' + shareIcon + ' <b>Share</b> in Safari, then <b>Add to Home Screen</b>.';
  } else {
    steps.innerHTML = 'Tap the <b>&#8942;</b> menu at the top right, then <b>Install app</b> or <b>Add to Home screen</b>.';
  }

  // Android / Chrome: use the real one-tap install when the browser offers it.
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferred = e;
    steps.textContent = 'One tap, no app store needed.';
    installBtn.hidden = false;
  });
  installBtn.addEventListener('click', function(){
    if(!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(c){ deferred = null; installBtn.hidden = true; if(c && c.outcome === 'accepted'){ hide(); } });
  });
  window.addEventListener('appinstalled', function(){ remember(); hide(); });
  document.getElementById('a2hs-close').addEventListener('click', function(){ remember(); hide(); });

  // The Help tab's "Add to my phone" button calls this, so the banner can always be reopened.
  window.shopShowInstall = function(){
    if(installed){ steps.textContent = "You're already using the Shop app."; installBtn.hidden = true; }
    show();
  };
  if(isPhone && !installed && !dismissedRecently()){ setTimeout(show, 2500); }
})();
</script>
</body>
